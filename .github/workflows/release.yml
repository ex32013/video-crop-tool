name: Build & Release

# 自动构建各平台可执行文件 + 自动发布 Release
# 触发: 推送 v1.0.0 / 1.0.0 形式的 tag, 或手动 Run workflow
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.*'
  workflow_dispatch:

permissions:
  contents: read   # 全局只读; 仅在 release job 提升为 write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: video-crop-tool-windows-x64.exe
            exe: video-crop-tool.exe
          - os: ubuntu-latest
            artifact: video-crop-tool-linux-x64
            exe: video-crop-tool-linux
          - os: macos-latest
            artifact: video-crop-tool-macos-arm64
            exe: video-crop-tool-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install pyinstaller==6.14.0 imageio-ffmpeg==0.6.0

      - name: Build (Windows)
        run: |
          python -m PyInstaller --onefile --name "$env:MATRIX_EXE" `
            --add-data "index.html;." `
            --collect-binaries imageio_ffmpeg `
            start_server.py
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          MATRIX_EXE: ${{ matrix.exe }}

      - name: Build (Unix)
        run: |
          python -m PyInstaller --onefile --name "${{ matrix.exe }}" \
            --add-data "index.html:." \
            --collect-binaries imageio_ffmpeg \
            start_server.py
        shell: bash
        if: runner.os != 'Windows'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 仅此 job 需要写 Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: |
            artifacts/*
            README.md
